name: Find place photos

on:
  push:
    branches: [main]
    paths: [scripts/images.py, data/geocoded.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/images.py
      - name: Commit photos and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/images.json data/images-log.txt js/images.js img/places
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update place photos"
          git pull --rebase origin main
          git push
          # pushes made with the workflow token don't start other workflows, so start the deploy here
          gh workflow run pages.yml --ref main
